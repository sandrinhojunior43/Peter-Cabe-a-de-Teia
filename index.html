<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee;height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:640px;display:flex;flex-direction:column;height:100vh;border-left:1px solid #333;border-right:1px solid #333}
header{padding:14px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:600}
.cfg{padding:10px 14px;background:#161616;border-bottom:1px solid #333;display:flex;gap:8px;flex-wrap:wrap}
.cfg input,.cfg select{flex:1;min-width:140px;padding:8px;background:#0d0d0d;border:1px solid #444;color:#eee;border-radius:6px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.user{align-self:flex-end;background:#c41e3a}
.bot{align-self:flex-start;background:#242424;border:1px solid #383838}
.err{align-self:flex-start;background:#3a1414;border:1px solid #a33;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-width:100%}
.hint{color:#777;font-size:13px;text-align:center;margin:auto;padding:20px;line-height:1.6}
footer{padding:12px;background:#1a1a1a;border-top:1px solid #333;display:flex;gap:8px}
#txt{flex:1;padding:11px;background:#0d0d0d;border:1px solid #444;color:#eee;border-radius:8px;font-size:14px}
button{padding:11px 14px;border:0;border-radius:8px;background:#c41e3a;color:#fff;font-size:15px;cursor:pointer}
button:active{opacity:.7}
#mic.on{background:#fff;color:#c41e3a;animation:p .8s infinite}
@keyframes p{50%{opacity:.5}}
#status{font-size:11px;color:#888;padding:6px 14px;background:#141414;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header><span>🕷️</span><h1>Peter</h1></header>

  <div class="cfg">
    <input type="password" id="key" placeholder="Cole sua chave sk-ant-...">
    <select id="model">
      <option value="claude-sonnet-4-5">Sonnet 4.5</option>
      <option value="claude-haiku-4-5">Haiku 4.5 (mais barato)</option>
      <option value="claude-3-5-sonnet-20241022">Sonnet 3.5</option>
      <option value="claude-3-5-haiku-20241022">Haiku 3.5</option>
    </select>
  </div>

  <div id="chat"><div class="hint">Cole sua chave da API acima.<br>Depois digite ou aperte o microfone e fale.</div></div>
  <div id="status">pronto</div>

  <footer>
    <input id="txt" placeholder="Escreve aqui...">
    <button id="send">&#10148;</button>
    <button id="mic">&#127908;</button>
  </footer>
</div>

<script>
const chat=document.getElementById('chat'),txt=document.getElementById('txt'),
      keyIn=document.getElementById('key'),modelIn=document.getElementById('model'),
      status=document.getElementById('status'),micBtn=document.getElementById('mic');

const SYSTEM = `Você é o Peter, também chamado de Cabeça de Teia, assistente pessoal do usuário.
Personalidade: inspirado no Peter Parker da Marvel — esperto, informal, bem-humorado, direto, fala português brasileiro coloquial.
Suas respostas serão LIDAS EM VOZ ALTA, então: seja natural, sem markdown, sem listas com asterisco, sem emoji, frases fluidas.
Responda de forma completa mas concisa (2 a 5 frases normalmente). Se o assunto for técnico, explica de verdade, sem enrolar.`;

let history=[];

keyIn.value = localStorage.getItem('anthKey')||'';
modelIn.value = localStorage.getItem('anthModel')||'claude-sonnet-4-5';
keyIn.onchange = ()=>localStorage.setItem('anthKey',keyIn.value.trim());
modelIn.onchange = ()=>localStorage.setItem('anthModel',modelIn.value);

function add(role,text){
  if(chat.querySelector('.hint')) chat.innerHTML='';
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':role==='err'?'err':'bot');
  d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return d;
}

async function ask(text){
  const key=keyIn.value.trim();
  if(!key){ add('err','Falta a chave da API. Cola lá em cima.'); return; }

  add('user',text);
  history.push({role:'user',content:text});
  const pending=add('bot','...');
  status.textContent='pensando...';

  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:modelIn.value,
        max_tokens:800,
        system:SYSTEM,
        messages:history
      })
    });

    const data=await r.json();

    if(!r.ok){
      pending.remove();
      history.pop();
      add('err','ERRO '+r.status+'\n'+JSON.stringify(data,null,2));
      status.textContent='erro '+r.status;
      return;
    }

    const reply=data.content.map(function(b){return b.text||'';}).join('').trim();
    pending.textContent=reply;
    history.push({role:'assistant',content:reply});
    speak(reply);

  }catch(e){
    pending.remove(); history.pop();
    add('err','FALHA DE REDE\n'+e.name+': '+e.message);
    status.textContent='falhou';
  }
}

function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='pt-BR'; u.rate=1.02; u.pitch=1.05;
    u.onstart=function(){status.textContent='falando...';};
    u.onend=function(){status.textContent='pronto';};
    speechSynthesis.speak(u);
  }catch(e){ status.textContent='pronto'; }
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false;
if(SR){
  rec=new SR(); rec.lang='pt-BR'; rec.continuous=false; rec.interimResults=false;
  rec.onstart=function(){on=true;micBtn.classList.add('on');status.textContent='ouvindo...';};
  rec.onend=function(){on=false;micBtn.classList.remove('on');};
  rec.onerror=function(e){
    on=false;micBtn.classList.remove('on');
    status.textContent='mic: '+e.error;
    if(e.error==='not-allowed') add('err','Microfone bloqueado. Libera a permissão do site no navegador.');
  };
  rec.onresult=function(e){
    const t=e.results[0][0].transcript.trim();
    if(t) ask(t);
  };
}else{
  micBtn.disabled=true; micBtn.textContent='X';
}

micBtn.onclick=function(){
  if(!rec) return;
  speechSynthesis.cancel();
  if(on){ rec.stop(); } else { rec.start(); }
};

function sendText(){
  const t=txt.value.trim();
  if(!t) return;
  txt.value='';
  ask(t);
}
document.getElementById('send').onclick=sendText;
txt.addEventListener('keydown',function(e){ if(e.key==='Enter') sendText(); });
</script>
</body>
</html>
